# REQ-DEMO-014: UiKit's default theme, unchanged (no theme tokens, no CSS framework, no CDN). The demo shell extends
# UiKit's demo platform layout and is the admin and guest layout of every page.
nowo_ui_kit:
    css_framework: custom
    base_stylesheet: true
    icon_set: none
    layouts:
        admin: 'base.html.twig'
        guest: 'base.html.twig'
