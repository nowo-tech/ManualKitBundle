# The demo manual: docs/manual (English at the root, Spanish under docs/manual/es). The chapter template extends the
# demo layout, so the manual sits inside the demo's navbar; links outside the manual open the published repository docs.
nowo_manual_kit:
    directory: '%kernel.project_dir%/docs/manual'
    source_locale: en
    locales: [en, es]
    role: ROLE_USER
    admin_role: ROLE_ADMIN
    # 1.13: named audiences (`audience: developer` in the manifest, <!-- audience: admin, developer --> blocks) and a
    # second manual root: the customer portal under /portal/help, in its own firewall, with `customer` chapters only.
    audiences:
        developer: ROLE_DEVELOPER
        customer: ROLE_CRM_CONTACT
    default_firewalls: [main]
    roots:
        portal:
            audiences: [customer]
            role: ROLE_CRM_CONTACT
            home: portal-home
            firewalls: [portal]
    docs_url: 'https://github.com/nowo-tech/ManualKitBundle/blob/main/demo/symfony8/docs/'
    layout: 'base.html.twig'
    # 1.11: redirects can also be written here (merged with docs/manual/redirects.yaml). A redirect to the admin
    # chapter answers like that chapter: 404 for members, 301 for administrators.
    redirects:
        old-admin: '02-admin'
    # 1.12: desktop / phone views — <!-- device: phone|desktop --> blocks (03-guide/projects.md), the Desktop / Phone
    # switch on chapters that have them, and images/x.phone.svg used in the phone view next to images/x.svg.
    device_views:
        enabled: true
        breakpoint: 768
        image_suffix: '.phone'
