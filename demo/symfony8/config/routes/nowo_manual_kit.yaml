# The manual in the visitor's language: /en/manual, /es/manual/01-getting-started, …
nowo_manual_kit:
    resource: '@NowoManualKitBundle/Resources/config/routes.php'
    prefix: '/{_locale}/manual'
    requirements:
        _locale: 'en|es'
    trailing_slash_on_root: false

# 1.13: the customer portal's manual root (routes nowo_manual.portal.*), inside the `portal` firewall.
nowo_manual_portal:
    resource: portal
    type: nowo_manual
    prefix: /portal/help
    trailing_slash_on_root: false
